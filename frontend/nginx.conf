server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Re-resolve the backend through Docker's DNS so a recreated backend container
  # (new IP) is picked up without restarting nginx. With a variable in proxy_pass
  # the original request URI is forwarded unchanged.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50g;
    # Stream large evidence uploads straight to the API instead of spooling them in nginx,
    # and allow long synchronous operations (e.g. file carving).
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }
  location /health { proxy_pass $backend; proxy_set_header Host $host; }
  location /ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
