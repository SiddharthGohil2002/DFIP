# DFIP default Scalpel signatures (used by POST /api/forensics/evidence/{id}/carve?engine=scalpel).
# Columns: extension  case-sensitive  max-size(bytes)  header  [footer]  [REVERSE|NEXT]
# Only the types below are carved by default; add lines to widen the search.

# Images
	jpg	y	20000000	\xff\xd8\xff\xe0\x00\x10	\xff\xd9
