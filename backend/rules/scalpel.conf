	png	y	20000000	\x89\x50\x4e\x47\x0d\x0a\x1a\x0a	\x49\x45\x4e\x44\xae\x42\x60\x82
	gif	y	5000000	\x47\x49\x46\x38\x37\x61	\x00\x3b
	gif	y	5000000	\x47\x49\x46\x38\x39\x61	\x00\x3b

# Documents
	pdf	y	20000000	%PDF	%EOF\x0d	REVERSE
	pdf	y	20000000	%PDF	%EOF\x0a	REVERSE
	doc	y	20000000	\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1\x00\x00	\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1\x00\x00	NEXT
