title: Failed logons for many accounts from one address (password spraying)
id: 1f3b5d72-8c0e-4a49-b6d2-7f9a1c3e5b10
status: stable
description: Failed logons for more than 5 different accounts from the same network address within 30 minutes, which suggests a few common passwords are being tried against many accounts.
references:
  - https://attack.mitre.org/techniques/T1110/003/
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  filter_local:
    IpAddress:
      - '-'
      - '127.0.0.1'
      - '::1'
  timeframe: 30m
  condition: selection and not filter_local | count(TargetUserName) by IpAddress > 5
falsepositives:
  - A shared computer where many users mistype their passwords
level: medium
